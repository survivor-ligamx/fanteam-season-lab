name: Modularize Player Lab
on:
  push:
    paths:
      - .github/workflows/modularize-player-lab.yml
permissions:
  contents: write
jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/modularizar-premier-player-lab
      - name: Split Player Lab mechanically
        shell: python
        run: |
          from pathlib import Path
          import re

          source_path = Path('src/premier-player-lab.js')
          source = source_path.read_text()

          groups = {
            'snapshots': [
              'localSnapshotAllowed', 'loadLocalCopilotSource', 'loadLocalCopilotSnapshot',
              'loadLocalDraftSource', 'loadLocalDraftSnapshot', 'loadLocalProbableSource',
              'loadLocalProbableSnapshot', 'loadPublicCopilotSnapshot', 'loadPublicDraftSnapshot',
              'loadPublicProbableSnapshot', 'safeSnapshotLoad', 'loadSignalSnapshots',
              'importCopilotFile', 'clearCopilotImport', 'importDraftFile', 'clearDraftImport',
              'importProbableFile', 'clearProbableImport'
            ],
            'matching': [
              'playerIdentity', 'ownNameAliases', 'nameTokens', 'abbreviationTokenMatches',
              'abbreviatedNameMatches', 'abbreviatedAliasesMatch', 'addUnique',
              'referencedFplIds', 'referencedFplCodes', 'rebuildCopilotMatches',
              'copilotForPlayer', 'rebuildDraftMatches', 'draftForPlayer',
              'rebuildProbableMatches', 'probableForPlayer'
            ],
            'monteCarlo': ['cancelMonteCarloJob', 'monteCarloFallback', 'startMonteCarlo'],
            'status': ['formatDateTime', 'signalSourceLabel', 'renderCopilotStatus', 'renderDraftStatus', 'renderProbableStatus']
          }

          top_level = re.compile(r'(?m)^  (?:async\s+)?function\s+([A-Za-z0-9_]+)\s*\(')
          matches = list(top_level.finditer(source))
          spans = {}
          for index, match in enumerate(matches):
            start = match.start()
            end = matches[index + 1].start() if index + 1 < len(matches) else source.find('  document.addEventListener', start)
            if end < 0:
              raise SystemExit(f'Unable to find end for {match.group(1)}')
            spans[match.group(1)] = (start, end)

          requested = [name for names in groups.values() for name in names]
          missing = [name for name in requested if name not in spans]
          if missing:
            raise SystemExit(f'Missing functions: {missing}')

          extracted = {}
          removals = []
          for name in requested:
            start, end = spans[name]
            extracted[name] = source[start:end].rstrip() + '\n'
            removals.append((start, end))
          for start, end in sorted(removals, reverse=True):
            source = source[:start] + source[end:]

          imports = (
            "import { createPlayerLabMatching } from './player-lab/matching.js';\n"
            "import { createPlayerLabMonteCarlo } from './player-lab/monte-carlo.js';\n"
            "import { createPlayerLabSnapshots } from './player-lab/snapshots.js';\n"
            "import { createPlayerLabStatusRenderers } from './player-lab/status-renderers.js';\n\n"
          )
          source = imports + source

          old_state_tail = (
            '  let monteCarloRequest = 0;\n'
            '  let activeMonteCarloJob = null;\n'
            '  let probableExpiryTimer = null;\n'
          )
          services = '''  let probableExpiryTimer = null;
  const playerLabActions = {};
  const {
    rebuildCopilotMatches, copilotForPlayer, rebuildDraftMatches, draftForPlayer,
    rebuildProbableMatches, probableForPlayer,
  } = createPlayerLabMatching({ state, Data, Draft, Consensus, Probable });
  const {
    loadSignalSnapshots, importCopilotFile, clearCopilotImport,
    importDraftFile, clearDraftImport, importProbableFile, clearProbableImport,
  } = createPlayerLabSnapshots({
    state, Copilot, Draft, Probable, PublicSignals, $, actions: playerLabActions,
  });
  const { cancelMonteCarloJob, monteCarloFallback, startMonteCarlo } = createPlayerLabMonteCarlo({
    state, MonteCarlo, actions: playerLabActions,
  });
  const { renderCopilotStatus, renderDraftStatus, renderProbableStatus } = createPlayerLabStatusRenderers({
    state, $, Data, Copilot, Draft, Probable, Consensus,
  });
  Object.assign(playerLabActions, {
    populateGameweeks, rebuildCopilotMatches, rebuildDraftMatches, rebuildProbableMatches,
    rebuildConsensus, renderAll, renderConsensusSquad, toast,
  });
'''
          if old_state_tail not in source:
            raise SystemExit('Mutable-state insertion point not found')
          source = source.replace(old_state_tail, services, 1)

          def body(names):
            return '\n'.join(extracted[name].rstrip() for name in names)

          snapshots = '''export function createPlayerLabSnapshots({
  state, Copilot, Draft, Probable, PublicSignals, $, actions,
}) {
  const populateGameweeks = (...args) => actions.populateGameweeks(...args);
  const rebuildCopilotMatches = (...args) => actions.rebuildCopilotMatches(...args);
  const rebuildDraftMatches = (...args) => actions.rebuildDraftMatches(...args);
  const rebuildProbableMatches = (...args) => actions.rebuildProbableMatches(...args);
  const rebuildConsensus = (...args) => actions.rebuildConsensus(...args);
  const renderAll = (...args) => actions.renderAll(...args);
  const toast = (...args) => actions.toast(...args);

''' + body(groups['snapshots']) + '''
  return {
    loadSignalSnapshots, importCopilotFile, clearCopilotImport,
    importDraftFile, clearDraftImport, importProbableFile, clearProbableImport,
  };
}
'''
          matching = '''export function createPlayerLabMatching({ state, Data, Draft, Consensus, Probable }) {
''' + body(groups['matching']) + '''
  return {
    rebuildCopilotMatches, copilotForPlayer, rebuildDraftMatches, draftForPlayer,
    rebuildProbableMatches, probableForPlayer,
  };
}
'''
          monte = '''export function createPlayerLabMonteCarlo({ state, MonteCarlo, actions }) {
  let monteCarloRequest = 0;
  let activeMonteCarloJob = null;
  const renderConsensusSquad = (...args) => actions.renderConsensusSquad(...args);

''' + body(groups['monteCarlo']) + '''
  return { cancelMonteCarloJob, monteCarloFallback, startMonteCarlo };
}
'''
          status = '''export function createPlayerLabStatusRenderers({
  state, $, Data, Copilot, Draft, Probable, Consensus,
}) {
''' + body(groups['status']) + '''
  return { renderCopilotStatus, renderDraftStatus, renderProbableStatus };
}
'''

          root = Path('src/player-lab')
          root.mkdir(exist_ok=True)
          (root / 'snapshots.js').write_text(snapshots)
          (root / 'matching.js').write_text(matching)
          (root / 'monte-carlo.js').write_text(monte)
          (root / 'status-renderers.js').write_text(status)
          source_path.write_text(source)

          html_path = Path('premier-player-lab.html')
          html = html_path.read_text()
          old_script = '<script src="src/premier-player-lab.js?v=3"></script>'
          new_script = '<script type="module" src="src/premier-player-lab.js?v=4"></script>'
          if old_script not in html:
            raise SystemExit('Player Lab entry script not found')
          html_path.write_text(html.replace(old_script, new_script, 1))
          Path('.github/workflows/modularize-player-lab.yml').unlink()
      - name: Commit modular Player Lab
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/premier-player-lab.js src/player-lab premier-player-lab.html .github/workflows/modularize-player-lab.yml
          git commit -m "refactor: split Player Lab into focused ES modules"
          git push