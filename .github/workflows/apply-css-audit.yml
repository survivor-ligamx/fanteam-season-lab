name: Apply CSS audit cleanup
on:
  push:
    branches: [copilot/audit-and-remove-unused-css]
    paths: [test/frontend/css-audit.test.mjs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/audit-and-remove-unused-css
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: mkdir -p docs
      - run: node scripts/audit-css.mjs --apply
      - run: node scripts/audit-css.mjs --report > /tmp/css-after.md
      - run: node --test test/frontend/css-audit.test.mjs
      - run: node --check src/app.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/report-css-audit.yml .github/workflows/apply-css-audit.yml
          git add src/fanteam-premium.css docs/css-audit-fanteam-premium.md
          git commit -m "Remove provably dead legacy club selectors from premium CSS"
          git push
