name: Diagnose app modularization CI
on:
  push:
    branches: [copilot/modulariza-src-app-js]
    paths: [.github/workflows/diagnose-app-modularization.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/modulariza-src-app-js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture E2E output
        shell: bash
        run: |
          set +e
          npm run test:e2e > /tmp/e2e.log 2>&1
          echo "E2E_STATUS=$?" >> /tmp/e2e.log
          tail -c 28000 /tmp/e2e.log > /tmp/e2e-tail.log
          {
            echo '## Diagnóstico E2E temporal (PR #66)'
            echo '```text'
            cat /tmp/e2e-tail.log
            echo '```'
          } > /tmp/comment.md
          exit 0
      - name: Post diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 66 --body-file /tmp/comment.md
