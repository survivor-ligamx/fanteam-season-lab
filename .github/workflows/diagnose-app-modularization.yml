name: Diagnose app modularization CI
on:
  push:
    branches: [copilot/modulariza-src-app-js]
    paths: [.github/workflows/diagnose-app-modularization.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/modulariza-src-app-js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint and tests
        shell: bash
        run: |
          set +e
          npm run lint > /tmp/diagnostics.log 2>&1
          echo "LINT_STATUS=$?" >> /tmp/diagnostics.log
          npm test >> /tmp/diagnostics.log 2>&1
          echo "TEST_STATUS=$?" >> /tmp/diagnostics.log
          tail -c 30000 /tmp/diagnostics.log > /tmp/diagnostics-tail.log
          {
            echo '## Diagnóstico automático temporal (PR #66)'
            echo '```text'
            cat /tmp/diagnostics-tail.log
            echo '```'
          } > /tmp/comment.md
          exit 0
      - name: Post diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 66 --body-file /tmp/comment.md
