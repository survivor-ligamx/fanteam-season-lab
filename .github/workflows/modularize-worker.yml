name: Modularize Worker
on:
  push:
    paths:
      - .github/workflows/modularize-worker.yml
permissions:
  contents: write
jobs:
  modularize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/fanteam-season-lab-dividir-index
      - name: Split Worker mechanically
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('worker/src/index.js')
          source = path.read_text()

          markers = [
            'function currentGameweek',
            'function allowedOrigin',
            'function apiFootballFailure',
            'async function getAPIFootballRegional',
            'async function getFootballData',
            'const FUTBOLFANTASY_CLUBS',
            'async function getFPLBootstrap',
            'function parsePlayerUpdates',
            'function summarizeFixtures',
            'async function buildPayload',
            'export default'
          ]
          positions = []
          for marker in markers:
            position = source.find(marker)
            if position < 0:
              raise SystemExit(f'Marker not found: {marker}')
            positions.append(position)
          if positions != sorted(positions):
            raise SystemExit('Unexpected worker source order')

          chunks = []
          starts = [0, *positions]
          ends = [*positions, len(source)]
          for start, end in zip(starts, ends):
            chunks.append(source[start:end].strip() + '\n')

          def exports(text, names):
            for name in names:
              text = re.sub(rf'(?m)^(async\s+function|function|class)\s+{name}\b', rf'export \1 {name}', text)
            return text

          config = re.sub(r'(?m)^const\s+', 'export const ', chunks[0])
          current_gw = "import { DEADLINES } from './config.js';\n\n" + exports(chunks[1], ['currentGameweek'])
          http = (
            "import { ALLOWED_ORIGINS, FUTBOLFANTASY_MAX_HTML_BYTES, REQUEST_TIMEOUT_MS } from './config.js';\n\n"
            + exports(chunks[2], ['allowedOrigin', 'responseJSON', 'retryAfterTimestamp', 'safeRequest', 'safeTextRequest'])
          )
          cache = exports(chunks[3], ['apiFootballFailure', 'readJSONCache', 'writeJSONCache', 'cachedAPIFootball'])
          api_football = (
            "import { API_FOOTBALL_BACKOFF_BASE_MS, API_FOOTBALL_BACKOFF_MAX_MS, API_FOOTBALL_FRESH_MS, API_FOOTBALL_REFRESH_BUDGET_MS, API_FOOTBALL_STALE_MS, MAX_LINEUP_REQUESTS, REQUEST_TIMEOUT_MS } from './config.js';\n"
            "import { safeRequest } from './http.js';\n"
            "import { apiFootballFailure, cachedAPIFootball, readJSONCache, writeJSONCache } from './cache.js';\n\n"
            + exports(chunks[4], ['getAPIFootballRegional', 'getAPIFootball', 'APIFootballCoordinator'])
          )
          external = "import { safeRequest } from './http.js';\n\n" + exports(chunks[5], ['getFootballData', 'getOdds', 'getNews'])
          futbolfantasy = (
            "import { FUTBOLFANTASY_FRESH_MS, FUTBOLFANTASY_HOME_URL, FUTBOLFANTASY_STALE_MS, FUTBOLFANTASY_URLS } from './config.js';\n"
            "import { readJSONCache, writeJSONCache } from './cache.js';\n"
            "import { safeTextRequest } from './http.js';\n\n"
            + exports(chunks[6], ['futbolFantasyEnabled', 'emptyFutbolFantasy', 'getFutbolFantasy'])
          )
          fpl = "import { safeRequest } from './http.js';\n\n" + exports(chunks[7], ['getFPLBootstrap'])
          players = "import { TEAM_CODES } from './config.js';\n\n" + exports(chunks[8], ['parsePlayerUpdates', 'normalizePlayerKey', 'mergePlayerRecords'])
          summaries = "import { TEAM_CODES } from './config.js';\n\n" + exports(chunks[9], ['summarizeFixtures', 'summarizeResults', 'summarizeOdds', 'summarizeNews', 'summarizeFPL'])
          payload = (
            "import { BUILD_ID, VERSION } from './config.js';\n"
            "import { currentGameweek } from './gameweek.js';\n"
            "import { getAPIFootball } from './api-football.js';\n"
            "import { getFootballData, getNews, getOdds } from './external-sources.js';\n"
            "import { emptyFutbolFantasy, futbolFantasyEnabled, getFutbolFantasy } from './futbolfantasy-source.js';\n"
            "import { getFPLBootstrap } from './fpl-source.js';\n"
            "import { mergePlayerRecords, parsePlayerUpdates } from './players.js';\n"
            "import { summarizeFixtures, summarizeFPL, summarizeNews, summarizeOdds, summarizeResults } from './summarizers.js';\n\n"
            + exports(chunks[10], ['buildPayload'])
          )
          router_body = chunks[11].replace('export default', 'const worker =', 1)
          router = (
            "import { BUILD_ID, DEGRADED_TTL_SECONDS, VERSION } from './config.js';\n"
            "import { allowedOrigin, responseJSON } from './http.js';\n"
            "import { buildPayload } from './payload.js';\n"
            "import { futbolFantasyEnabled } from './futbolfantasy-source.js';\n\n"
            + router_body + "\nexport default worker;\n"
          )
          index = (
            "import worker from './router.js';\n"
            "export { APIFootballCoordinator } from './api-football.js';\n"
            "export default worker;\n"
          )

          files = {
            'config.js': config,
            'gameweek.js': current_gw,
            'http.js': http,
            'cache.js': cache,
            'api-football.js': api_football,
            'external-sources.js': external,
            'futbolfantasy-source.js': futbolfantasy,
            'fpl-source.js': fpl,
            'players.js': players,
            'summarizers.js': summaries,
            'payload.js': payload,
            'router.js': router,
            'index.js': index,
          }
          root = Path('worker/src')
          for name, content in files.items():
            (root / name).write_text(content)
          Path('.github/workflows/modularize-worker.yml').unlink()
      - name: Commit modular Worker
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker/src .github/workflows/modularize-worker.yml
          git commit -m "refactor: split Worker into focused ES modules"
          git push