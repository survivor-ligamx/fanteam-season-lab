name: Apply quality tooling

on:
  push:
    branches:
      - refactor/extract-inline-scripts-and-lint
    paths:
      - .github/workflows/apply-quality-tooling.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Generate configuration and lockfile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.scripts.lint = 'eslint "src/**/*.js" "worker/src/**/*.js" "scripts/**/*.mjs"';
          pkg.scripts["lint:fix"] = 'npm run lint -- --fix';
          pkg.scripts.format = 'prettier --write "**/*.{js,mjs,json,md,yml,yaml,css,html}"';
          pkg.scripts["format:check"] = 'prettier --check "**/*.{js,mjs,json,md,yml,yaml,css,html}"';
          pkg.devDependencies.eslint = "9.32.0";
          pkg.devDependencies.prettier = "3.6.2";
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

          cat > eslint.config.js <<'EOF'
          export default [
            {
              ignores: [
                "legacy/**",
                ".local-data/**",
                "node_modules/**",
                "test-results/**",
                "src/players-data.js",
              ],
            },
            {
              files: ["src/**/*.js"],
              languageOptions: { ecmaVersion: "latest", sourceType: "script" },
            },
            {
              files: ["worker/src/**/*.js", "scripts/**/*.mjs"],
              languageOptions: { ecmaVersion: "latest", sourceType: "module" },
            },
          ];
          EOF

          cat > .prettierrc.json <<'EOF'
          {
            "semi": true,
            "singleQuote": false,
            "trailingComma": "all",
            "printWidth": 100,
            "tabWidth": 2,
            "endOfLine": "lf"
          }
          EOF

          cat > .prettierignore <<'EOF'
          legacy/
          .local-data/
          node_modules/
          test-results/
          package-lock.json
          index.html
          src/players-data.js
          src/fixtures-config.js
          src/fanteam-premium.css
          src/premier-pages.css
          *.min.js
          *.min.css
          EOF

          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/test.yml')
          text = path.read_text()
          marker = '      - name: Install Chromium\n'
          step = '      - name: Lint JavaScript\n        run: npm run lint\n\n'
          if step not in text:
              text = text.replace(marker, step + marker)
          path.write_text(text)
          PY

          npm install --package-lock-only --ignore-scripts

      - name: Commit generated changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-quality-tooling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: add ESLint and Prettier quality gate"
          git push origin HEAD:refactor/extract-inline-scripts-and-lint
