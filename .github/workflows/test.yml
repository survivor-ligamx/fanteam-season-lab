name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modularize-player-lab:
    if: github.event_name == 'pull_request' && github.head_ref == 'copilot/modularizar-premier-player-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: copilot/modularizar-premier-player-lab
          fetch-depth: 0
      - name: Execute mechanical split
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/modularize-player-lab.yml').read_text()
          section = workflow.split('        run: |\n', 1)[1].split('      - name: Commit modular Player Lab', 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines())
          exec(compile(code, 'modularize-player-lab', 'exec'))
      - name: Restore workflow and commit generated modules
        run: |
          git checkout origin/main -- .github/workflows/test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/premier-player-lab.js src/player-lab premier-player-lab.html .github/workflows/test.yml .github/workflows/modularize-player-lab.yml
          git commit -m "refactor: split Player Lab into focused ES modules"
          git push

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run regression suite
        run: npm test

      - name: Run Chromium smoke
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-diagnostics
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7
