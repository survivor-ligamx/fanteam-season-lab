name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-player-lab:
    if: github.event_name == 'pull_request' && github.head_ref == 'copilot/modularizar-premier-player-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: copilot/modularizar-premier-player-lab
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture lint diagnostics
        run: npm run lint > player-lab-lint.txt 2>&1 || true
      - name: Restore workflow and commit diagnostics
        run: |
          git checkout origin/main -- .github/workflows/test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add player-lab-lint.txt .github/workflows/test.yml
          git commit -m "chore: capture Player Lab lint diagnostics"
          git push

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint JavaScript
        run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run regression suite
        run: npm test
      - name: Run Chromium smoke
        run: npm run test:e2e
