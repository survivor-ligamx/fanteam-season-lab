name: Report CSS audit
on:
  push:
    branches: [copilot/audit-and-remove-unused-css]
    paths: [scripts/audit-css.mjs]
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/audit-and-remove-unused-css
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit-css.mjs --report > /tmp/css-audit.md
      - name: Post audit report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 67 --body-file /tmp/css-audit.md
