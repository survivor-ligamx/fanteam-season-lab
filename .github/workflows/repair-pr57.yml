name: Repair PR 57

on:
  push:
    branches:
      - refactor/extract-inline-scripts-and-lint
    paths:
      - .github/workflows/repair-pr57.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Restore every PR file from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --name-only origin/main...HEAD > /tmp/pr57-files.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              git checkout origin/main -- "$path"
            else
              rm -rf -- "$path"
            fi
          done < /tmp/pr57-files.txt

          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to restore"
            exit 0
          fi
          git commit -m "fix: restore PR 57 to main baseline"
          git push origin HEAD:refactor/extract-inline-scripts-and-lint
