name: Apply app.js modularization
on:
  push:
    branches: [copilot/modulariza-src-app-js]
    paths: [scripts/split-app-modules.mjs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: copilot/modulariza-src-app-js
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/split-app-modules.mjs
      - run: node --test test/frontend/app-architecture.test.mjs
      - run: node scripts/validate-catalog.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/split-app-modules.mjs .github/workflows/apply-app-modularization.yml
          git add src
          git commit -m "Modularize src/app.js into cohesive classic modules"
          git push
