# Cloudflare Worker: fanteam-data
# Respaldo del Worker desplegado. Deploy: `npx wrangler deploy` desde esta carpeta.

name = "fanteam-data"
main = "src/index.js"
compatibility_date = "2026-07-01"

# NOTA: este Worker NO usa cron. La frescura la gobierna el caché de borde
# (caches.default) dentro del propio código: sirve la respuesta cacheada y
# reconstruye el payload cuando expira el TTL.

# Secrets requeridos (NO van en este archivo — usar `wrangler secret put <NOMBRE>`
# o el dashboard: Settings → Variables and Secrets → tipo Secret):
#   API_FOOTBALL_KEY   → API-Football (lesiones, fixtures, alineaciones)
#   FOOTBALL_DATA_KEY  → Football-Data.org (calendario/resultados PL)
#   ODDS_API_KEY       → The Odds API (momios)
#   GNEWS_API_KEY      → GNews (noticias)
